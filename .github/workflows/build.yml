name: Build crDroid for Galaxy A51

on:
  workflow_dispatch:

jobs:
  crave-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup & Verify Crave CLI
        run: |
          sudo mkdir -p /usr/local/bin
          curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash
          
          # Move binary from wherever get_crave saved it straight to system PATH
          for loc in $HOME/bin/crave $HOME/.bin/crave ./crave; do
            if [ -f "$loc" ]; then
              sudo cp "$loc" /usr/local/bin/crave
              break
            fi
          done
          
          sudo chmod +x /usr/local/bin/crave
          
          # Verify binary execution in same step
          crave version || crave --help

      - name: Authenticate Crave & Link Dashboard Project
        run: |
          echo "${{ secrets.CRAVE_CONF }}" > $HOME/crave.conf
          git remote remove origin || true
          git remote add origin https://github.com/accupara/los23.2.git

      - name: Sync Source & Build crDroid
        run: |
          crave run --no-patch -- "rm -rf .repo/local_manifests && repo init -u https://github.com/crdroidandroid/android.git -b 17.0 --git-lfs && git clone https://github.com/Exynos9611Development/local_manifests.git -b lineage-23.2 .repo/local_manifests && /opt/crave/resync.sh && source build/envsetup.sh && lunch crdroid_a51-userdebug && mka bacon"

      - name: Pull ROM Zip from Crave
        run: |
          crave pull out/target/product/a51/*.zip .

      - name: Upload ROM Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-Galaxy-A51
          path: "*.zip"
