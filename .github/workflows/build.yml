name: Build crDroid for Galaxy A51

on:
  workflow_dispatch:

jobs:
  crave-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          sudo mkdir -p /usr/local/bin
          curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash
          
          for loc in $HOME/bin/crave $HOME/.bin/crave ./crave; do
            if [ -f "$loc" ]; then
              sudo cp "$loc" /usr/local/bin/crave
              break
            fi
          done
          
          sudo chmod +x /usr/local/bin/crave

      - name: Authenticate & Build crDroid
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          # Write exact formatted secret to workspace
          echo "$CRAVE_CONF_DATA" > crave.conf
          echo "$CRAVE_CONF_DATA" > $HOME/crave.conf
          
          # Verify config file is non-empty
          if [ ! -s crave.conf ]; then
            echo "ERROR: CRAVE_CONF secret is empty or missing from Repository Secrets!"
            exit 1
          fi

          git remote remove origin || true
          git remote add origin https://github.com/accupara/los23.2.git

          # Force Crave to use the explicitly provided config file
          crave -c crave.conf run --no-patch -- "rm -rf .repo/local_manifests && repo init -u https://github.com/crdroidandroid/android.git -b 17.0 --git-lfs && git clone https://github.com/Exynos9611Development/local_manifests.git -b lineage-23.2 .repo/local_manifests && /opt/crave/resync.sh && source build/envsetup.sh && lunch crdroid_a51-userdebug && mka bacon"

      - name: Pull ROM Zip from Crave
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          crave -c crave.conf pull out/target/product/a51/*.zip .

      - name: Upload ROM Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-Galaxy-A51
          path: "*.zip"
