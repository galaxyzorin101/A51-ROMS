name: Build crDroid for Galaxy A51

on:
  workflow_dispatch:

jobs:
  crave-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          sudo mkdir -p /usr/local/bin
          curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash
          
          for loc in $HOME/bin/crave $HOME/.bin/crave ./crave; do
            if [ -f "$loc" ]; then
              sudo cp "$loc" /usr/local/bin/crave
              break
            fi
          done
          
          sudo chmod +x /usr/local/bin/crave

      - name: Authenticate & Build crDroid (Android 16)
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          echo "$CRAVE_CONF_DATA" > crave.conf
          echo "$CRAVE_CONF_DATA" > $HOME/crave.conf

          git remote remove origin || true
          git remote add origin https://github.com/accupara/los23.2.git

          # Target crDroid 12.0 (Android 16), fetch lineage-23.2 trees, purge extra devices, and build a51
          crave -c crave.conf run --no-patch -- "rm -rf .repo/local_manifests && repo init -u https://github.com/crdroidandroid/android.git -b 12.0 --git-lfs && git clone https://github.com/Exynos9611Development/local_manifests.git -b lineage-23.2 .repo/local_manifests && /opt/crave/resync.sh && rm -rf device/samsung/f41 device/samsung/m31s device/samsung/m31 device/samsung/m21 vendor/samsung/f41 vendor/samsung/m31s vendor/samsung/m31 vendor/samsung/m21 && source build/envsetup.sh && lunch crdroid_a51-userdebug && mka bacon"

      - name: Pull ROM Zip from Crave
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          crave -c crave.conf pull out/target/product/a51/*.zip .

      - name: Upload ROM Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: crDroid-Galaxy-A51
          path: "*.zip"
