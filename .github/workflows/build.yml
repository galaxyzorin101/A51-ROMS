name: Build Evolution X for Galaxy A51

on:
  workflow_dispatch:

jobs:
  crave-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          sudo mkdir -p /usr/local/bin
          curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash
          for loc in $HOME/bin/crave$HOME/.bin/crave ./crave; do
            if [ -f "$loc" ]; then
              sudo cp "$loc" /usr/local/bin/crave
              break
            fi
          done
          sudo chmod +x /usr/local/bin/crave

      - name: Authenticate & Build Evolution X (A51)
        timeout-minutes: 360
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          echo "$CRAVE_CONF_DATA" > crave.conf
          echo "$CRAVE_CONF_DATA" > $HOME/crave.conf

          git remote remove origin || true
          git remote add origin https://github.com/accupara/los23.2.git

          crave -c crave.conf --verbose run --no-patch -- "
            git config --global user.name 'build' &&
            git config --global user.email 'build@local' &&
            export BUILD_USERNAME=android-build &&
            export BUILD_HOSTNAME=crave &&
            export USE_CCACHE=0 &&
            rm -rf .repo/local_manifests &&
            mkdir -p .repo/local_manifests &&
            echo '<?xml version=\"1.0\" encoding=\"UTF-8\"?>
            <manifest>
              <remote name=\"Development\" fetch=\"https://github.com/Exynos9611Development/\" revision=\"lineage-23.2\" />
              <remote name=\"los\" fetch=\"https://github.com/LineageOS/\" revision=\"lineage-23.2\" />

              <project path=\"hardware/samsung\" name=\"android_hardware_samsung\" remote=\"los\" clone-depth=\"1\" />
              <project path=\"hardware/samsung_slsi/libbt\" name=\"android_hardware_samsung_slsi_libbt\" remote=\"los\" clone-depth=\"1\" />
              <project path=\"hardware/samsung_slsi/nfc\" name=\"android_hardware_samsung_slsi_nfc\" remote=\"los\" clone-depth=\"1\" />
