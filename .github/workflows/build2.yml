name: Build Evolution X for Galaxy A51 build.sh

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crave-build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Crave CLI
        run: |
          sudo mkdir -p /usr/local/bin
          curl -sL https://raw.githubusercontent.com/accupara/crave/master/get_crave.sh | bash
          for loc in $HOME/bin/crave $HOME/.bin/crave ./crave; do
            if [ -f "$loc" ]; then
              sudo cp "$loc" /usr/local/bin/crave
              break
            fi
          done
          sudo chmod +x /usr/local/bin/crave

      - name: Run Build via Crave
        timeout-minutes: 340
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          echo "$CRAVE_CONF_DATA" > crave.conf
          echo "$CRAVE_CONF_DATA" > $HOME/crave.conf

          git remote remove origin || true
          git remote add origin https://github.com/accupara/los23.2.git

          # Execute our clean build script inside Crave
          crave -c crave.conf --verbose run --no-patch -- bash build.sh

      - name: Pull Build Artifacts and Logs from Crave
        if: always()
        env:
          CRAVE_CONF_DATA: ${{ secrets.CRAVE_CONF }}
        run: |
          crave -c crave.conf pull out/target/product/a51/*.zip . || true
          crave -c crave.conf pull build.log . || true
          crave -c crave.conf pull device/samsung/a51/ . || true
          crave -c crave.conf pull .repo/local_manifests/a51.xml . || true

      - name: Push Patched Sources & Logs to GitHub
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Push sources branch
          git checkout -B a51-evo-baklava-source
          [ -d a51 ] && git add -f a51/
          [ -f a51.xml ] && git add -f a51.xml
          git commit -m "Add Evolution X patches, IMS, and KernelSU Next [skip ci]" || true
          git push origin a51-evo-baklava-source --force || true

          # Push build logs branch
          git checkout -B build-logs
          [ -f build.log ] && git add -f build.log
          git commit -m "Upload build logs [skip ci]" || exit 0
          git push origin build-logs --force

      - name: Upload ROM Artifact to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionX-Galaxy-A51-Build
          path: |
            *.zip
            build.log
